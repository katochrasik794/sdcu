name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # ubuntu-latest is 26.04, and actions/setup-python has no 3.9 build for it.
    # 3.9 remains the supported floor (packages/core/pyproject.toml).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        node-version: ["18.x", "20.x"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install networkx rich

    - name: Run Test Suite
      run: |
        PYTHONPATH=packages/core python -m unittest discover tests

    - name: Test CLI Audit Execution
      run: |
        ./packages/cli/bin/sdcu.js audit

